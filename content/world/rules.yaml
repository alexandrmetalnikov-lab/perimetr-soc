# Регламенты и угрозы из бюллетеня. day — с какой смены действует (1 = первая), until — до какой включительно.
rules:
  - key: rule.bank
    day: 1
    text: Смена банковских реквизитов контрагента принимается только после звонка по контакту из договора.
  - key: rule.mfa
    day: 1
    text: Удалённый доступ (VPN) разрешён только с MFA.
  - key: rule.dormant
    day: 1
    text: "УЗ, неактивная более 90 дней: вход допускается, только если кадровая система подтверждает, что сотрудник работает."
  - key: rule.reset
    day: 1
    text: Сброс или перепривязка MFA выполняются только после обратного звонка на номер из кадровой системы.
  - key: rule.hash
    day: 1
    text: Обновление ПО допускается, только если хэш совпадает с опубликованным вендором.
  - key: rule.matrix
    day: 2
    text: Доступ выдаётся по матрице ролей. Согласует руководитель, указанный в матрице. Заявитель не может согласовать заявку сам себе.
  - key: rule.contractor
    day: 2
    text: Подрядчики получают доступ только при действующем договоре и NDA и только со своих IP-адресов из договора.
  - key: rule.lp
    day: 3
    text: "До отдельного уведомления письма с домена logplus.ru недоверенные: вложения и ссылки не пропускать, документы принимать через ЭДО."

threats:
  - key: threat.mfa
    day: 1
    text: "Волна MFA-бомбинга: серия отклонённых push-запросов, за которой следует одобрение."
  - key: threat.call
    day: 1
    text: Злоумышленники звонят в helpdesk от имени сотрудников, используя данные из соцсетей.
  - key: threat.thread
    day: 2
    text: "Рассылки ответами в существующую переписку: письмо приходит в знакомую цепочку, но с постороннего адреса, часто с архивом под паролем."
  - key: threat.lp
    day: 3
    text: ООО «Логистик Плюс» 04.11 сообщило о взломе своего почтового сервера.

# Сколько эскалаций принимает вторая линия за смену (без учёта покупок).
escalations_per_shift: 4
