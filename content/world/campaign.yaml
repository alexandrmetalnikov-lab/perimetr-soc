# Смены, утренние новости, вечерние покупки и итог сквозной атаки.
#
# Условия (when) — общий формат для кейсов и новостей:
#   flags:      { флаг: значение }     все перечисленные флаги равны значениям
#   not_flags:  { флаг: значение }     ни один не равен
#   upgrade:    id покупки             покупка сделана
#   no_upgrade: id покупки             покупки нет
# Флаги выставляет поле fx в кейсах.

days:
  - n: 1
    date: 02.11.2026
    dow: понедельник
    start: "09:00"
    end: "18:00"
    trial: [sandbox, ti]   # пробные лицензии на эту смену
  - n: 2
    date: 03.11.2026
    dow: вторник
    start: "09:00"
    end: "17:00"
  - n: 3
    date: 05.11.2026
    dow: четверг
    start: "09:00"
    end: "18:00"

# Утренние новости. effects применяются при показе: pts — очки, loyalty — лояльность.
news:
  - day: 2
    text: Пробные лицензии песочницы и TI-подписки закончились.
  - day: 2
    text: "Сегодня предпраздничный день: смена до 17:00."
  - day: 2
    text: "Новый тип объектов: заявки на доступ. В справочнике появилась вкладка «Доступ» с матрицей ролей."

  - day: 3
    when: { flags: { chain: contained } }
    tone: good
    text: "По вашей эскалации вторая линия нашла письмо «Re: Акт сверки» ещё у трёх сотрудников и удалила его до открытия. Отправитель заблокирован на шлюзе. +5 очков."
    effects: { pts: 5 }
  - day: 3
    when: { flags: { crm: leaked } }
    tone: bad
    text: "«Маркетинг-Лаб» не выходит на связь, а база клиентов «Северного терминала» выставлена на продажу на теневом форуме. Это утечка персональных данных, компания уведомляет Роскомнадзор. −20 очков, лояльность −15."
    effects: { pts: -20, loyalty: -15 }
  - day: 3
    when: { flags: { crm: escalated } }
    tone: good
    text: Коммерческий директор и вторая линия отклонили выгрузку для «Маркетинг-Лаб». Генеральный согласился подождать договора.
  - day: 3
    when: { flags: { crm: blocked } }
    text: Генеральный директор недоволен отказом в выгрузке, но коммерческий директор вас поддержал.
  - day: 3
    when: { flags: { snow: escalated } }
    tone: good
    text: "Вторая линия подтвердила компрометацию УЗ подрядчика ДатаСервис: пароль утёк через инфостилер. Пароль сменён, MFA включена, готовится уведомление в Роскомнадзор."
  - day: 3
    when: { flags: { snow: blocked } }
    text: "УЗ подрядчика заблокирована, но расследование началось только утром: выгрузку 1,8 ГБ из CRM нашли с опозданием. −10 очков."
    effects: { pts: -10 }
  - day: 3
    when: { flags: { snow: missed } }
    tone: bad
    text: ДатаСервис сообщил, что пароль его сотрудника утёк. Выгрузка 1,8 ГБ из CRM прошла незамеченной, уведомление в Роскомнадзор отправлено с опозданием. −20 очков.
    effects: { pts: -20 }
  - day: 3
    text: 04.11 ООО «Логистик Плюс» сообщило о взломе своего почтового сервера. В бюллетене новый временный регламент.
  - day: 3
    when: { upgrade: nm }
    text: Number matching включён для всех сотрудников.

# Вечерний бюджет, млн ₽. Начисление: base + бонусы.
budget:
  base: 3
  bonus_no_missed: 2
  bonus_loyalty: { min: 80, value: 1 }
  bonus_warnings: { max: 2, value: 1 }

upgrades:
  - id: sandbox
    name: Песочница
    cost: 3
    desc: Снова открывает слой «Песочница» для вложений и ссылок. Пробная лицензия закончилась.
  - id: ti
    name: TI-подписка
    cost: 2
    desc: "Открывает слои TI: репутация IP и доменов, учётные данные из логов инфостилеров."
  - id: nm
    name: Number matching для MFA
    cost: 1
    desc: "Для подтверждения входа нужно ввести число с экрана. MFA-бомбинг перестаёт работать. Пользователи будут недовольны: лояльность −5."
    effects: { loyalty: -5 }
  - id: training
    name: Обучение бухгалтерии
    cost: 2
    desc: Сотрудники начнут нажимать «Сообщить о фишинге», и вы увидите это на объекте.
  - id: overtime
    name: Переработка второй линии
    cost: 1
    once: true
    desc: +2 эскалации на следующую смену. Действует один день.
    effects: { escalations: 2 }

# Итог сквозной атаки «Ответ» в финальном отчёте. Берётся первое подходящее.
chain:
  name: Сквозная атака «Ответ»
  outcomes:
    - when: { flags: { chain: contained } }
      tone: good
      text: Остановлена на шаге 1. Письмо удалено у всех получателей до открытия.
    - when: { flags: { chain: blocked, retry: escalated } }
      tone: good
      text: Остановлена на шаге 1 со второй попытки. Вторая линия теперь знает о кампании.
    - when: { flags: { chain: blocked, retry: blocked } }
      tone: mid
      text: Отбита дважды, но вторая линия о кампании так и не узнала. Атакующий попробует снова.
    - when: { flags: { chain: blocked } }
      tone: bad
      text: "Атакующий закрепился со второй попытки: сотрудник открыл ссылку. Следующий шаг — маячок в сети."
    - when: { flags: { chain: foothold, beacon: escalated } }
      tone: good
      text: Остановлена на шаге 2. Хост изолирован и расследован до кражи учётных данных.
    - when: { flags: { chain: foothold, kerb: escalated } }
      tone: mid
      text: Остановлена на шаге 3. Атакующий успел запросить билеты сервисных УЗ, их пароли придётся менять.
    - when: { flags: { chain: foothold } }
      tone: bad
      text: Атакующий закрепился и получил билеты сервисных УЗ. Следующий шаг — администратор домена и шифрование.
  debrief: >-
    Цепочка повторяет типовую атаку 2022–2023 годов. Qakbot рассылался ответами в настоящую переписку
    с чужих взломанных ящиков: архив с паролем или ссылка, внутри ярлык, который загружает DLL.
    Дальше маячок Cobalt Strike, кража учётных данных (в игре — Kerberoasting) и шифрование Black Basta.
    В августе 2023 года ФБР и партнёры ликвидировали инфраструктуру Qakbot (операция Duck Hunt).
    Источник: CISA AA24-131A.
