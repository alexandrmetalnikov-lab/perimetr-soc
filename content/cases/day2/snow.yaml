debrief:
  name: Snowflake (2024)
  text: >-
    Группа UNC5537 входила в клиентские учётные записи Snowflake с паролями из логов инфостилеров.
    На этих УЗ не было MFA и ограничений по IP. Пострадали около 165 организаций, в том числе AT&T и Ticketmaster.
