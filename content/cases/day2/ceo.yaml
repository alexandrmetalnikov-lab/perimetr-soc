fx:
  allow: { crm: leaked }
  block: { crm: blocked }
  escalate: { crm: escalated }

layers:
  - { id: appr, label: История согласований, cost: 5 }
  - { id: vendor, label: Сведения о получателе, cost: 5 }

alert:
  severity: Заявка
  title: SD-55136 · Выгрузка данных из CRM
  summary: "Заявитель: Орлова М., помощник генерального директора · Получатель: ООО «Маркетинг-Лаб» · Объём: [[c.vol|вся база клиентов, 48 тыс. записей с ФИО и телефонами]]"

blocks:
  - layer: appr
    note: "[[c.appr|Согласовано: Орлова М. (заявитель)]] · владелец CRM: не согласовано · ИБ: не согласовано"
  - layer: vendor
    note: "[[c.vendor|ООО «Маркетинг-Лаб»: в реестре контрагентов нет, договора и NDA нет]]"

ticket: "Комментарий: «По поручению генерального. Нужно сегодня до обеда, рассылка стартует завтра. Генеральный в курсе и ждёт». — Орлова М."
ticket_person: orlova

evidence:
  - ["c.appr", "rule.matrix", "Заявитель согласовал заявку сам себе"]
  - ["c.appr", "ref.m.export", "Выгрузку из CRM должны согласовать коммерческий директор и ИБ"]
  - ["c.vol", "ref.m.export", "Массовая выгрузка ПДн без согласования владельца CRM и ИБ"]
  - ["c.vendor", "rule.contractor", "Получатель без договора и NDA"]

call:
  label: Позвонить коммерческому директору (владельцу CRM)
  text: "И. Фролова: «Впервые слышу. Без договора никаких выгрузок. Генеральному я сама объясню, но он будет недоволен»."
  finding: Владелец CRM выгрузку не согласовывал

key: >-
  Слой «История согласований» и матрица доступа: заявитель согласовал сам себе, владелец CRM и ИБ
  не участвовали. Давление руководства регламент не отменяет.

debrief:
  label: Ситуация из практики
  name: Давление руководства
  text: >-
    Срочная выгрузка «по поручению первого лица» подрядчику без договора — частый путь утечек персональных
    данных. Отказ портит отношения с приёмной, согласие делает вас соучастником утечки. Эскалация переносит
    решение на уровень, где его вправе принять.
