id: ceo
day: 2
order: 3
kind: alert
type: Доступ
title: "Срочно: выгрузка базы клиентов для подрядчика"
truth: policy
outcomes: { allow: policy, block: best, escalate: ok }
par: 5
loyalty_cost: { block: 10 }
