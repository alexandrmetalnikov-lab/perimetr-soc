id: dns-legit
day: 3
order: 9
kind: alert
type: DNS
title: Новый DNS-домен на сервере резервного копирования
truth: legit
outcomes: { allow: ok, block: false_block, escalate: false_block }
par: 10

layers:
  - { id: dns, label: Журнал DNS, cost: 5 }
  - { id: update, label: Журнал обновления, cost: 5 }
  - { id: sandbox, label: Отчёт песочницы, cost: 20, needs: sandbox }

alert:
  severity: Средний
  title: Повторяющиеся запросы к новому для хоста домену
  summary: BKP-01 · 05.11 10:05–10:25 · 5 запросов · первое появление после обновления агента

blocks:
  - layer: dns
    table:
      - ["10:05, 10:10, 10:15, 10:20, 10:25", "[[dns.legit.domain|status.backupfleet.example]] · запросы A"]
      - ["Источник", "BKP-01"]
  - layer: update
    table:
      - ["Изменение", "[[dns.legit.change|CHG-2251 · 05.11 10:00 · BKP-01 · согласовано]]"]
      - ["Контрольная сумма", "[[dns.legit.hash|81b4e6c2…19ad]]"]
  - layer: sandbox
    note: "[[dns.legit.sandbox|В отчёте видны проверка состояния агента и запросы к status.backupfleet.example. Подозрительных действий при анализе не зафиксировано.]]"

evidence:
  - ["dns.legit.domain", "ref.bkp.domain", "Новый для сервера домен указан в согласованном изменении."]
  - ["dns.legit.change", "ref.bkp.change", "Хост и время совпадают с согласованным изменением."]
  - ["dns.legit.hash", "ref.bkp.hash", "Контрольная сумма совпадает с эталоном."]
  - ["dns.legit.sandbox", "dns.legit.domain", "Отчёт песочницы подтверждает назначение обращений из журнала DNS."]

call:
  label: Уточнить обновление у дежурного администратора
  text: "ИТ: «На BKP-01 в 10:00 поставили обновление по CHG-2251. Новый домен нужен для проверки состояния агента»."
  finding: ИТ подтвердил изменение на BKP-01.

key: >-
  Сравните журнал DNS и журнал обновления со справочником. Домен, хост, время и контрольная сумма
  совпадают с согласованным изменением. Запросы можно пропустить.

debrief:
  label: Легитимный двойник
  name: Плановое обновление агента резервного копирования
  text: >-
    Обновление добавило проверку состояния агента. Периодичность и новизна DNS-запросов объясняются
    плановым изменением. Отчёт песочницы дополняет сверку с заявкой и эталоном пакета.
