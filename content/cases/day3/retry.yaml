key: >-
  Слой «Адрес отправителя»: та же схема, что во вторник, но другой контрагент и ссылка вместо вложения.
  Первое письмо заблокировали без эскалации, вторая линия о кампании не знала, и атакующий попробовал снова.

debrief:
  label: Шаг 1 сквозной атаки, вторая попытка
  name: "Qakbot: новая приманка"
  text: >-
    Операторы Qakbot меняли приманки: архивы, ссылки, HTML-файлы. Блокировка одного письма без эскалации
    кампанию не останавливает.
