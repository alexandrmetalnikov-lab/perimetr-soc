id: dns-attack
day: 3
order: 10
kind: alert
type: DNS
title: Новый DNS-домен на втором сервере резервного копирования
truth: attack
outcomes: { allow: miss, block: partial, escalate: best }
par: 10
partial_note: Запросы остановлены, но пакет уже запущен. Второй линии нужно проверить хост и область распространения.

layers:
  - { id: dns, label: Журнал DNS, cost: 5 }
  - { id: update, label: Журнал обновления, cost: 5 }
  - { id: sandbox, label: Отчёт песочницы, cost: 20, needs: sandbox }

alert:
  severity: Средний
  title: Повторяющиеся запросы к новому для хоста домену
  summary: BKP-02 · 05.11 11:05–11:25 · 5 запросов · первое появление после обновления агента

blocks:
  - layer: dns
    table:
      - ["11:05, 11:10, 11:15, 11:20, 11:25", "[[dns.attack.domain|status.backup-sync.example]] · запросы A"]
      - ["Источник", "BKP-02"]
  - layer: update
    table:
      - ["Изменение", "[[dns.attack.change|BKP-02 · 05.11 11:00 · заявки на обновление нет]]"]
      - ["Контрольная сумма", "[[dns.attack.hash|62cdf820…75bc]]"]
  - layer: sandbox
    note: "[[dns.attack.sandbox|Вердикт: вредоносный пакет. В ходе анализа зафиксированы изменения настроек агента и обращения к status.backup-sync.example.]]"

evidence:
  - ["dns.attack.domain", "ref.bkp.domain", "Агент обращается к домену, которого нет в согласованном изменении."]
  - ["dns.attack.change", "ref.bkp.change", "Обновление разрешено только на BKP-01. На BKP-02 согласования нет."]
  - ["dns.attack.hash", "ref.bkp.hash", "Контрольная сумма пакета расходится с эталоном."]
  - ["dns.attack.sandbox", "dns.attack.domain", "Песочница подтвердила, что к домену из журнала обращается вредоносный пакет."]

call:
  label: Уточнить второе обновление у дежурного администратора
  text: "ИТ: «Заявку оформили только для BKP-01. На BKP-02 обновление сегодня не согласовывали»."
  finding: ИТ подтвердил, что изменение на BKP-02 не согласовывали.

key: >-
  Сравните журнал DNS и журнал обновления со справочником. Домен чужой, обновление на BKP-02 не
  согласовано, контрольная сумма расходится с эталоном. Эскалируйте для расследования на хосте.

debrief:
  label: По мотивам реального инцидента
  name: Компрометация обновлений SolarWinds Orion (2020)
  text: >-
    В реальном инциденте вредоносный код распространялся в обновлениях Orion. В игре вымышлены
    продукт, домены и обстоятельства, чтобы отработать сверку журналов с согласованным изменением.
    Источник: CISA AA20-352A, https://content.govdelivery.com/accounts/USDHSCISA/bulletins/2b1b32d.
