key: >-
  Слои «События 4769» и «Учётная запись»: бухгалтер массово запрашивает билеты к сервисным УЗ с RC4.
  Это Kerberoasting, атакующий уже использует украденную УЗ.

debrief:
  label: Шаг 3 сквозной атаки
  name: Kerberoasting
  text: >-
    Атакующий запрашивает билеты к сервисным учётным записям и подбирает их пароли офлайн. Сервисные УЗ
    часто имеют широкие права и старые пароли, поэтому это быстрый путь к администратору домена.
