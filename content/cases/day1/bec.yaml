  body: |
    Добрый день!

    В связи с проверкой наш расчётный счёт временно заблокирован. Просим оплату по счёту № 1187 на сумму 4 860 000 ₽ провести сегодня до 17:00 по новым реквизитам во вложении. Задержка оплаты приведёт к остановке отгрузок.

    По всем вопросам звоните мне напрямую.
    Сергей Павлов, бухгалтерия
    [[bec.phone|+7 499 113-08-52]]
  attachment: Novye_rekvizity_schet_1187.pdf · 96 КБ

