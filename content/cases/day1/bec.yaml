key: >-
  Поверхность: телефон в подписи не совпадает со справочником контрагентов.
  Песочница здесь бесполезна: в BEC нет вредоноса, атака целиком в тексте.

debrief:
  label: Основано на реальном инциденте
  name: Дело Римасаускаса против Google и Facebook (2013–2015)
  text: >-
    Эвалдас Римасаускас выдавал себя за тайваньского производителя Quanta Computer и отправлял двум
    компаниям поддельные счета от похожей на настоящую фирмы. Они перевели ему более 100 млн долларов.
    В 2019 году он получил 5 лет заключения.
