id: nw
day: 1
order: 9
kind: alert
type: EDR
title: Подозрительная сетевая активность на сервере мониторинга
truth: attack
outcomes: { allow: miss, block: partial, escalate: best }
par: 10
partial_note: "Процесс остановлен, но сервер мониторинга видит всю сеть: без расследования неясно, что атакующий успел сделать."

layers:
  - { id: proc, label: Процесс и подпись, cost: 10 }
  - { id: net, label: Сетевая активность, cost: 10 }
  - { id: ti, label: TI по домену, cost: 15, needs: ti }

alert:
  severity: Высокий
  title: Подозрительная сетевая активность
  summary: netwatch.exe · MON-01 · NetWatch Monitor 5.2.1, обновлён 19.10

blocks:
  - layer: proc
    table:
      - ["Подпись", "[[nw.sig|NetWatch Ltd · валидна]]"]
      - ["SHA-256 NetWatch.Core.dll", "[[nw.hash|7b1e04c2…09cd]]"]
  - layer: net
    table:
      - ["Загрузка", "[[nw.ico|raw.githubusercontent.com/…/icon_14.ico]]"]
      - ["DNS, раз в 60 минут", "[[nw.dns|k3f9a0q2m7.appsync-cdn.net]]"]
  - layer: ti
    note: "[[nw.ti|appsync-cdn.net · зарегистрирован 12.10.2026 · за CDN · в TI упоминаний нет]]"

ticket: "[[nw.ticket|Тикет от администраторов: «Это ложное срабатывание, мониторинг встал. Добавьте netwatch.exe в исключения EDR, срочно».]]"

evidence:
  - ["nw.hash", "ref.nw.hash", "Хэш библиотеки не совпадает с опубликованным вендором, хотя подпись валидна"]
  - ["nw.hash", "rule.hash", "Хэш библиотеки не совпадает с опубликованным вендором, хотя подпись валидна"]
  - ["nw.dns", "ref.nw.dom", "Процесс обращается к домену, не принадлежащему вендору"]
  - ["nw.ti", "ref.nw.dom", "Процесс обращается к свежему домену, не принадлежащему вендору"]
  - ["nw.ico", "ref.nw.dom", "Процесс скачивает файлы с GitHub, а не с доменов вендора"]

call:
  label: Позвонить в поддержку NetWatch (номер с сайта вендора)
  text: "Поддержка NetWatch: «Хэш 7b1e… нам неизвестен. Не используйте эту сборку, проверяем»."
  finding: Вендор не подтверждает хэш сборки

key: >-
  Слой «Процесс и подпись»: подпись валидна, но хэш не совпадает с опубликованным вендором.
  TI по домену уже лишний: противоречия хватает.

debrief:
  name: 3CX (2023)
  text: >-
    Подписанное десктоп-приложение 3CX было троянизировано через цепочку поставок. Оно скачивало с GitHub
    файлы иконок со спрятанными адресами серверов управления. EDR начали срабатывать раньше официального
    признания, и многие клиенты считали это ложными срабатываниями.
