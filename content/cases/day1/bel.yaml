debrief:
  name: Colonial Pipeline (2021)
  text: >-
    Группа DarkSide вошла через VPN под учётной записью, которой давно не пользовались. MFA на ней не было,
    пароль, по всей видимости, утёк раньше. Компания на несколько дней остановила трубопровод и заплатила
    выкуп около 4,4 млн долларов.
