debrief:
  name: MGM Resorts (2023)
  text: >-
    Участники Scattered Spider нашли сотрудника в LinkedIn и позвонили в службу поддержки от его имени.
    Разговор занял около 10 минут. Дальше было шифрование инфраструктуры с помощью ALPHV/BlackCat;
    MGM оценила ущерб примерно в 100 млн долларов. Источник: CISA AA23-320A.
