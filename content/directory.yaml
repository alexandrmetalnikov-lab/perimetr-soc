# Регламенты, угрозы и справочники. day — с какой смены появляется запись (1 = первая).
rules:
  - { key: rule.bank, day: 1, text: Смена банковских реквизитов контрагента принимается только после звонка по контакту из договора. }
  - { key: rule.mfa, day: 1, text: Удалённый доступ (VPN) разрешён только с MFA. }
  - { key: rule.dormant, day: 1, text: "УЗ, неактивная более 90 дней: вход допускается, только если кадровая система подтверждает, что сотрудник работает." }
  - { key: rule.reset, day: 1, text: Сброс или перепривязка MFA выполняются только после обратного звонка на номер из кадровой системы. }
  - { key: rule.hash, day: 1, text: Обновление ПО допускается, только если хэш совпадает с опубликованным вендором. }

threats:
